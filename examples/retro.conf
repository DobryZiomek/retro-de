# ~/.config/retro-de/retro.conf - every key is optional.  Values shown are
# the defaults from config.def.h unless noted.  Format: key = value, '#'
# comments.  The Style Manager (retro-settings) edits this file for you;
# which modules exist at all is decided at build time (./configure).
# Monitors are not set here: retro-display writes monitors.conf.
#
# The settings can be split by subject.  These files are read as well when
# they exist next to this one (samples of each are installed beside it):
#   keys.conf      key bindings              bind = Mod4+c exec retro-calc
#   windows.conf   window behaviour          edge_snap, placement, focus ...
#   programs.conf  rules for programs        rule = class=firefox => workspace=2
# and `include = FILE` reads any other file.  Apply edits with
# `retro-settings --reload`.

# ---- look ------------------------------------------------------------------
theme = CDE                     # CDE Classic Broica Solaris Olive Crimson Motif
                                # Platinum HighContrast; a C theme module
                                # (Redmond Hotdog Midnight Terminal Lilac, or
                                # your own NAME.so) or a NAME.theme file in
                                # themes/ - see `retro-settings --list-themes -v`
#style = cde                    # cde | classic (default: the theme's own)
font = sans-9                   # Xft pattern, or core:<XLFD> bitmap font
#font.bold = sans-9:bold
# override single theme colours:
#color.face = #aeb2c3
#color.title_active = #b24d7a
#color.desktop = #5d6f8e
# (also light shadow dark text disabled field select_bg select_fg
#  title_inactive title_fg title_fg_inactive desktop_fg alert good)

# ---- default applications ----------------------------------------------------
# "auto": the XDG default application (xdg-mime) when available, otherwise
# the first installed program from a built-in list.
terminal = auto
browser = auto
filemanager = auto
editor = auto
locker = auto                   # e.g. slock, xsecurelock, i3lock, xlock
clock = auto                    # xclock when installed; right-click the
                                # panel clock or run @clock

# ---- integration (all optional) --------------------------------------------
dbus = auto                     # auto | on | off  (session bus if missing)
xdg_menus = on                  # .desktop applications in menus / @app
xdg_autostart = off             # run ~/.config/autostart/*.desktop
power_backend = auto            # auto systemd elogind consolekit openbsd
                                # freebsd netbsd generic none
power_priv = auto               # prefix for poweroff on plain inits:
                                # auto (doas -n or sudo -n), or e.g. "doas"
confirm_logout = on

# ---- window manager ----------------------------------------------------------
workspaces = 4
workspace_names = One,Two,Three,Four
focus = click                   # click | sloppy
titlebar_doubleclick = maximize # maximize | shade
#border_width = 6               # 6 with the CDE style, 4 with Classic
mouse_mod = Mod1                # Mod1+drag moves, Mod1+right-drag resizes
#desktop_icons = on             # minimized windows as desktop icons
                                # (default: on with CDE, off with Classic)
layout = float                  # default layout: float tile monocle
tile_master = 55                # master column width in percent

# bind = <Modifiers+Key> <action> [argument]; replaces a default on the same
# key.  unbind = <Modifiers+Key> removes one.  Actions: close maximize
# minimize shade sticky fullscreen above lower window_menu cycle cycle_back
# workspace N  sendto N  next_workspace prev_workspace  exec CMD
# layout NAME  next_layout  toggle_tile toggle_float master_grow
# master_shrink swap_master quit restart
# exec takes the special commands too: @browser @filemanager @editor @lock
# @clock @logout @poweroff @reboot @suspend @app ID
#bind = Mod4+c exec @app org.gnome.Calculator
#unbind = Control+Mod1+BackSpace

# ---- panel ------------------------------------------------------------------
panel_style = taskbar           # taskbar (Windows-95 look, the default) |
                                # frontpanel (CDE) | auto (by window style)
#panel_monitor = primary        # primary | 1, 2, ... | an output name (DP-1)
# CDE front panel controls: clock calendar files editor terminal browser
# style apps network
fp_left = clock calendar files editor
fp_right = terminal browser style apps
# taskbar
panel_position = bottom         # bottom | top
#panel_height = 28
start_label = Start
clock_format = %H:%M            # strftime(3)
# applets (taskbar, and the front panel's status area); built in:
# cpu mem battery net bluetooth dnd awake volume clock, plus any block
# (dnd = do not disturb, awake = keep the screen on: click to switch)
applets = cpu mem battery net bluetooth dnd awake volume clock
# blocks: NAME SECONDS COMMAND (first output line is shown)
#block = load 10 uptime | sed 's/.*average[s]*: //'
#block_click = load @terminal -e top
# pick one of the modules compiled in (config.h), or auto / none:
audio_backend = auto            # auto sndio pipewire pulseaudio alsa oss mixerctl
net_backend = auto              # auto iwd ifconfig wpa none
#net_priv = doas                # prefix for ifconfig on OpenBSD
bluetooth_backend = auto        # auto bluez none

# ---- file explorer and calculator ------------------------------------------
#files_hidden = off             # retro-files: show hidden files
#files_sort = name              # name | size | date
#calc_angle = deg               # retro-calc: deg | rad

# ---- programs folder -------------------------------------------------------
# `programs "Programs"` in menu.conf shows this folder: sub-folders are the
# categories, files the programs.  Arrange it with a file manager.
#programs_dir = ~/.config/retro-de/programs

# ---- desktop ----------------------------------------------------------------
#desktop_pattern = weave        # solid checker dots dense hlines vlines
                                # diagonal bricks weave (default: from theme)
#desktop_pattern_color = #4d5f7e
#wallpaper = Clouds             # an installed one by name (Clouds Dusk
                                # Meadow "Night Sky" Setup Waves Argyle
                                # Bricks Houndstooth Rivets Tiles Weave), one
                                # of yours in wallpapers/, or a path to an
                                # XPM3 or PPM (P3/P6) file; none = no picture
wallpaper_mode = auto           # auto (tile small pictures, fill with large
                                # ones) | fill | stretch | center | tile;
                                # every monitor gets its own copy
icon_single_click = false
