# A retro-de theme package.  Build it with
#     retro-pkg create examples/packages/Sunset
# and install the .rtp with `retro-pkg install Sunset-1.0.rtp --apply`
# (or install this folder directly).
name = Sunset
version = 1.0
author = retro-de
description = Warm evening palette with a vector sunset wallpaper

# what `retro-pkg apply Sunset` writes into retro.conf
theme = Sunset
style = classic
wallpaper = Sunset
wallpaper_mode = fill
