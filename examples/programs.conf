# ~/.config/retro-de/programs.conf - options for specific programs.
#
# Read together with retro.conf; after editing run `retro-settings --reload`.
#
#   rule = MATCH ... => OPTION ...
#
# A rule applies to every new window that matches all of its MATCH parts.
# Several rules may match one window; later lines win.
#
# MATCH (patterns: * and ?, upper/lower case ignored; "quotes" for blanks)
#   class=Firefox        the program's class      \  both are shown by
#   name=navigator       its instance name        /  `xprop WM_CLASS`
#   title="*- Mozilla*"  the window title
#   type=dialog          normal dialog utility splash
#
# OPTION
#   workspace=N | workspace=all      where it opens (all = on every one)
#   monitor=N                        on that monitor (1 = first)
#   geometry=WxH+X+Y                 size and/or position on the monitor;
#                                    -X / -Y count from the right / bottom
#                                    (geometry=400x300, geometry=+0+0,
#                                    geometry=300x200-10-10)
#   center                           in the middle of the monitor
#   snap=left|right|top|bottom|topleft|topright|bottomleft|bottomright
#   maximized  fullscreen  minimized  shaded
#   sticky  above  below
#   float                            never tiled
#   tile                             tiled even if it asked to float
#   noborder | border                without / with title bar and border
#   skip_taskbar  skip_pager         not listed on the panel / in pagers
#   nofocus                          opens without taking the focus

# ---- examples ---------------------------------------------------------------
# the browser on workspace 2, maximized
#rule = class=firefox => workspace=2 maximized

# a clock in the corner of every workspace, out of the way
#rule = class=XClock => workspace=all geometry=140x140-10+10 noborder below skip_taskbar nofocus

# the calculator floats above tiled windows
#rule = class=retro-calc => float above

# a terminal named "scratch" (xterm -name scratch): bottom half, on top
#rule = name=scratch => snap=bottom above

# every dialog in the middle of the screen
#rule = type=dialog => center

# the mail program starts minimized on workspace 4 of the second monitor
#rule = class=thunderbird => workspace=4 monitor=2 minimized

# video players without decorations
#rule = class=mpv => noborder

# picture-in-picture windows stay on top and visible everywhere
#rule = title="Picture-in-Picture" => sticky above skip_taskbar
