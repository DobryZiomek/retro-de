# ~/.config/retro-de/keys.conf - key bindings.
#
# Read together with retro.conf (so are windows.conf and programs.conf);
# after editing run `retro-settings --reload` or press the key you bound to
# `restart`.  Every line here may also live in retro.conf.
#
#   bind = <Modifiers+Key> <action> [argument]
#   unbind = <Modifiers+Key>          removes a built-in binding
#
# Modifiers: Shift Control (Ctrl) Mod1 (Alt) Mod4 (Super, Win) Mod2 Mod3 Mod5
# Keys: X keysym names - a..z, 0..9, F1.., Left Right Up Down, Return, space,
# Tab, Escape, Print, XF86AudioRaiseVolume ... (`xev` shows them).
# A bind on a key that is already bound replaces the old one.
#
# Actions
#   windows     close maximize minimize shade sticky fullscreen above lower
#               window_menu cycle cycle_back toggle_float
#   moving      snap left|right|top|bottom|topleft|topright|bottomleft|bottomright
#               center
#               move left|right|up|down       (one move_step, see windows.conf)
#               move DX DY                    (pixels, e.g. move -100 0)
#               resize DW DH                  (pixels, e.g. resize 0 64)
#               to_monitor next|prev|N
#   workspaces  workspace N   sendto N   next_workspace   prev_workspace
#   tiling      layout float|tile|monocle   next_layout   swap_master
#               master_grow   master_shrink
#   desktop     dnd [on|off]      do not disturb
#               awake [on|off]    keep the screen on (no saver, no blanking)
#               restart   quit
#   programs    exec COMMAND      a shell command, or one of
#               @terminal @browser @filemanager @editor @clock @lock @open X
#               @app ID @screensaver @logout @poweroff @reboot @suspend

# ---- the built-in defaults, for reference (config.h) ----------------------
#bind = Mod4+Left snap left
#bind = Mod4+Right snap right
#bind = Mod4+Up maximize
#bind = Mod4+Down center
#bind = Mod4+Shift+Left to_monitor prev
#bind = Mod4+Shift+Right to_monitor next
#bind = Mod4+Mod1+Left move left          # ... Right Up Down
#bind = Mod4+Control+Right resize 32 0    # ... Left Up Down
#bind = Mod4+n dnd
#bind = Mod4+k awake
#bind = Mod4+e exec @filemanager
#bind = Control+Mod1+t exec @terminal

# ---- examples ---------------------------------------------------------------
# quarters of the screen on the numeric keypad
#bind = Mod4+KP_Home snap topleft
#bind = Mod4+KP_Prior snap topright
#bind = Mod4+KP_End snap bottomleft
#bind = Mod4+KP_Next snap bottomright

# programs
#bind = Mod4+c exec retro-calc
#bind = Mod4+f exec retro-files
#bind = Print exec import -window root ~/screenshot.png

# monitor profiles made in retro-display
#bind = Mod4+F7 exec retro-display --profile docked
#bind = Mod4+F8 exec retro-display --profile laptop

# volume keys
