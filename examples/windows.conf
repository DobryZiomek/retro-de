# ~/.config/retro-de/windows.conf - how windows behave.
#
# Read together with retro.conf; after editing run `retro-settings --reload`.
# Values shown are the defaults.

# ---- focus ------------------------------------------------------------------
focus = click                   # click | sloppy (focus follows the mouse)
focus_new = on                  # a new window takes the focus
titlebar_doubleclick = maximize # maximize | shade
mouse_mod = Mod1                # Mod1+drag moves, Mod1+right-drag resizes

# ---- moving and snapping ----------------------------------------------------
snap_distance = 10              # a dragged window sticks to screen edges and
                                # to other windows within this many pixels;
                                # 0 = off
edge_snap = on                  # drag a window to the left/right edge of the
                                # screen: half the monitor; into a corner: a
                                # quarter; to the top edge: maximized.  Drag it
                                # away again and it gets its old size back.
move_step = 32                  # pixels for `move left` ... from the keyboard

# ---- where new windows appear -----------------------------------------------
placement = cascade             # cascade | smart (least overlap) | center |
                                # pointer (under the mouse)

# ---- look -------------------------------------------------------------------
#border_width = 6               # 6 with the CDE style, 4 with Classic
#desktop_icons = on             # minimized windows as desktop icons
                                # (default: on with CDE, off with Classic)

# ---- workspaces and tiling --------------------------------------------------
workspaces = 4
workspace_names = One,Two,Three,Four
layout = float                  # default layout: float tile monocle
tile_master = 55                # master column width in percent

# ---- quiet and awake --------------------------------------------------------
dnd = off                       # do not disturb at login.  While it is on,
                                # programs cannot pull themselves to the
                                # front, nothing flashes for attention and
                                # notifications are paused (dunst).  Toggle:
                                # the DND switch on the panel, Super+n, @dnd.
#dnd_on_cmd = dunstctl set-paused true     # your own commands instead
#dnd_off_cmd = dunstctl set-paused false
keep_awake = off                # keep the screen on at login: no screen saver,
                                # no blanking, the monitor stays on.  Toggle:
                                # the Awake switch on the panel, Super+k, @awake.

# ---- screen saver -----------------------------------------------------------
screensaver = auto              # auto: xscreensaver when installed (the
                                # session starts it; set it up with
                                # Settings > Screen Saver), else blank
                                # xscreensaver | blank (just a black screen) |
                                # off
screensaver_timeout = 10        # minutes before blanking (blank mode;
                                # xscreensaver has its own), never = off
monitor_off = 20                # minutes before the monitor powers down
                                # (DPMS), never = off
