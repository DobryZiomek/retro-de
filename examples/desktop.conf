# ~/.config/retro-de/desktop.conf - desktop icons, laid out top to bottom.
#
#   icon "Label" <picture> command
#   app <desktop-file-id> ["Label"]
#
# <picture> is a built-in pictogram (app terminal folder file editor
# computer display network browser calculator clock settings bluetooth game
# info programs) or the path of an XPM/PPM image (scaled down to 32x32).  `app` takes
# name, command and icon from an installed .desktop file; its Icon= is used
# when an XPM/PPM version exists in pixmaps/ or icons/hicolor/.

icon "Programs" programs retro-programs
icon "Terminal" terminal @terminal
icon "Run..." app retro-run
icon "Network" network retro-net
#app firefox
#app org.gnome.Calculator "Calculator"
