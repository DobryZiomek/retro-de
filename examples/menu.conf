# ~/.config/retro-de/menu.conf - the Start / root menu.
#
#   menu "Label" {          opens a submenu (may nest), closed by a lone }
#   item "Label" command    runs command through /bin/sh
#   separator
#
#   applications "Label"    a submenu with every installed .desktop
#                           application, grouped by category (bare
#                           `applications` puts the categories inline)
#
#   programs "Label"        your programs folder, ~/.config/retro-de/programs:
#                           each sub-folder is a category, each file a program
#                           (a text file holding the command, a .desktop
#                           file, an executable, or a link to one).  Arrange
#                           it with a file manager; "Organize..." opens it.
#
# Special commands: @terminal [args]  (best available terminal emulator),
# @app ID (a .desktop application), @browser, @filemanager, @editor,
# @clock, @screensaver, @dnd, @awake, @open FILE-OR-URL, @lock, @logout (asks first), @poweroff, @reboot,
# @suspend, @hibernate (through the power module), @restart (window
# manager).

programs "Programs"
applications "Applications"
menu "Settings" {
    item "Style Manager" retro-settings
    item "Display" retro-display
    item "Screen Saver" @screensaver
    item "Do Not Disturb (on/off)" @dnd
    item "Keep Screen On (on/off)" @awake
    item "Bluetooth" retro-bt
    item "Network" retro-net
}
separator
item "Run..." retro-run
item "About retro-de" retro-about
separator
item "Restart WM" @restart
item "Lock Screen" @lock
item "Shut Down" @poweroff
item "Log Out" @logout
